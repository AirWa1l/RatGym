apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama
  template:
    metadata:
      labels:
        app: llama
    spec:

      initContainers:
      - name: pull-model
        image: ollama/ollama:latest
        command:
          - sh
          - -c
          - |
            ollama serve &
            sleep 5
            ollama pull llama3.2
        volumeMounts:
          - name: ollama-data
            mountPath: /root/.ollama

      # 🔹 CONTENEDOR PRINCIPAL
      containers:
        - name: llama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

      # 🔹 VOLUMEN COMPARTIDO
      volumes:
        - name: ollama-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-service
spec:
  selector:
    app: llama
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP

