apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  labels:
    app: saga-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga-orchestrator
  template:
    metadata:
      labels:
        app: saga-orchestrator
    spec:
      containers:
      - name: saga-orchestrator
        image: ratgym/saga-orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3010
        env:
        - name: PORT
          value: "3010"
        - name: NODE_ENV
          value: "production"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: RABBITMQ_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /saga/all
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /saga/all
            port: 3010
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
spec:
  selector:
    app: saga-orchestrator
  ports:
    - protocol: TCP
      port: 3010
      targetPort: 3010
  type: ClusterIP
