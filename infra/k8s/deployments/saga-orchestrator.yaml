apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  labels:
    app: saga-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga-orchestrator
  template:
    metadata:
      labels:
        app: saga-orchestrator
    spec:
      containers:
      - name: saga-orchestrator
        image: ratgym/saga-orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        env:
        - name: PORT
          value: "3005"
        - name: NODE_ENV
          value: "production"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: RABBITMQ_URL
        - name: USER_SERVICE_QUEUE
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: USER_SERVICE_QUEUE
        - name: ROUTINE_SERVICE_QUEUE
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: ROUTINE_SERVICE_QUEUE
        - name: NUTRITION_SERVICE_QUEUE
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: NUTRITION_SERVICE_QUEUE
        - name: CLASS_SERVICE_QUEUE
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: CLASS_SERVICE_QUEUE
        - name: NOTIFICATION_SERVICE_QUEUE
          valueFrom:
            configMapKeyRef:
              name: ratgym-config
              key: NOTIFICATION_SERVICE_QUEUE
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /saga/health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /saga/health
            port: 3005
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
  labels:
    app: saga-orchestrator
spec:
  selector:
    app: saga-orchestrator
  ports:
    - protocol: TCP
      port: 3005
      targetPort: 3005
      name: http
  type: ClusterIP
