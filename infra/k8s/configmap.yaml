apiVersion: v1
kind: ConfigMap
metadata:
  name: ratgym-config
  labels:
    app: ratgym
data:
  # RabbitMQ Configuration
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  
  # Service URLs (for HTTP communication)
  USER_SERVICE_URL: "http://user-service:3001"
  ROUTINE_SERVICE_URL: "http://routine-service:3002"
  CLASS_SERVICE_URL: "http://class-service:3003"
  NUTRITION_SERVICE_URL: "http://nutrition-service:3004"
  SAGA_ORCHESTRATOR_URL: "http://saga-orchestrator:3005"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3006"
  RECOMMENDATION_SERVICE_URL: "http://recommendation-service:3007"
  SHELL_URL: "http://shell:3000"
  
  # RabbitMQ Queues (for async communication)
  USER_SERVICE_QUEUE: "user_service_queue"
  ROUTINE_SERVICE_QUEUE: "routine_service_queue"
  NUTRITION_SERVICE_QUEUE: "nutrition_service_queue"
  CLASS_SERVICE_QUEUE: "class_service_queue"
  NOTIFICATION_SERVICE_QUEUE: "notifications_queue"
  RECOMMENDATION_SERVICE_QUEUE: "recommendation_service_queue"
  SAGA_ORCHESTRATOR_QUEUE: "saga_orchestrator_queue"
  
  # Service Ports
  USER_SERVICE_PORT: "3001"
  ROUTINE_SERVICE_PORT: "3002"
  CLASS_SERVICE_PORT: "3003"
  NUTRITION_SERVICE_PORT: "3004"
  SAGA_ORCHESTRATOR_PORT: "3005"
  NOTIFICATION_SERVICE_PORT: "3006"
  RECOMMENDATION_SERVICE_PORT: "3007"
  SHELL_PORT: "3000"
